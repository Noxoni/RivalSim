[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalsim"
version = "0.5.0"
description = "GPU-native Rocket League standard-1v1 simulation and Rival 2.0 training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "torch==2.13.0",
    "warp-lang==1.16.0",
]

[project.optional-dependencies]
oracle = ["rocketsim==2.2.1"]
benchmark = ["nvidia-ml-py==13.610.43", "psutil==7.2.2"]
dev = [
    "nvidia-ml-py==13.610.43",
    "psutil==7.2.2",
    "pytest==9.1.1",
    "rocketsim==2.2.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["rivalsim*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Kernel modules embed source-ordered native C++ snippets whose expression
# grouping is part of the RocketSim/Bullet fidelity contract.
"rivalsim/kernels/*.py" = ["E501", "SIM"]
